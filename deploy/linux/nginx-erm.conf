# Nginx 反向代理示例 — 复制到 /etc/nginx/sites-available/erm
# ln -s /etc/nginx/sites-available/erm /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
#
# HTTPS 证书: certbot --nginx -d erm.yourcompany.com

upstream erm_backend {
    server 127.0.0.1:8088;
    keepalive 32;
}

server {
    listen 80;
    server_name erm.yourcompany.com;

    # 强制 HTTPS（证书配置完成后取消注释）
    # return 301 https://$host$request_uri;

    client_max_body_size 32M;

    location / {
        proxy_pass http://erm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

